name: publish

# 打 tag 就发版：git tag v0.5.0 && git push origin v0.5.0
# 认证走 OIDC 可信发布（Trusted Publishing），不需要任何 token：
#   npm 网页 → Settings → Trusted Publishing → GitHub Actions
#   package: dsh-bili-search / repository: fromzero1501/dsh-bili-search / workflow: publish.yml / 允许 publish
# 有了这条关系之后，本 job 靠 id-token 换一次性凭证，npm 侧不再需要 NPM_TOKEN。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance 需要
    steps:
      - uses: actions/checkout@v4

      # 不能给 registry-url：它会在 .npmrc 里写 `_authToken=${NODE_AUTH_TOKEN}` 占位，
      # npm 于是走 token 认证、不再换 OIDC，结果就是 PUT 404（0.5.1 实测踩过）。
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 清干净任何 token 配置，确保 npm 只能走 OIDC 可信发布
      - name: 确保无 token、直连官方 registry
        run: |
          for f in "$HOME/.npmrc" "${NPM_CONFIG_USERCONFIG:-}"; do
            [ -n "$f" ] && [ -f "$f" ] && sed -i '/_authToken/d' "$f" || true
          done
          npm config set registry https://registry.npmjs.org/ --location=user
          npm config get registry
          echo "authToken 残留行数：$(cat "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}" 2>/dev/null | grep -c _authToken || true)"

      # 可信发布（OIDC）要 npm CLI ≥ 11.5.1，Node 22 自带的是 10.x，会直接 ENEEDAUTH
      - name: 升级 npm CLI（OIDC 支持）
        run: |
          npm install -g npm@latest
          npm --version

      # peer 依赖 @deepseek-ai/dsh-tools 不在公共 registry 上，冒烟要 import lib/index.js，先打桩
      - name: 宿主 peer 依赖打桩
        run: |
          mkdir -p node_modules/@deepseek-ai/dsh-tools
          printf '%s\n' '{"name":"@deepseek-ai/dsh-tools","version":"0.0.0-ci-stub","type":"module","exports":"./index.js"}' > node_modules/@deepseek-ai/dsh-tools/package.json
          cat > node_modules/@deepseek-ai/dsh-tools/index.js <<'EOF'
          // CI 专用桩：只保留冒烟用到的那部分契约（defineTool 把参数表编译成 JSON Schema）。
          export function defineTool(options) {
            return {
              name: options.name,
              description: options.description,
              parameters: { type: 'object', properties: options.parameters },
              execute: options.execute,
            }
          }
          EOF

      - name: 发版前先跑一遍验收
        run: npm run check && npm run smoke && npm run test:requests

      - name: 校验 tag 与 package.json 版本一致
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$ver" ]; then
            echo "tag $tag 与 package.json 的 $ver 不一致，停下"
            exit 1
          fi

      - name: npm publish（OIDC 可信发布，无 token）
        run: npm publish --provenance --access public
